apiVersion: v1
kind: Namespace
metadata:
  name: tasky
  labels:
    # Preventative in-cluster control: Pod Security Admission rejects any pod in
    # this namespace that is privileged, runs as root, mounts host paths, etc.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
