apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasky-sa
  namespace: tasky
automountServiceAccountToken: true
---
# INTENTIONAL WEAKNESS (exercise requirement): the application's service account
# is bound to the built-in cluster-admin ClusterRole. Anyone who gets code
# execution in a tasky pod can read every Secret and control the whole cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tasky-sa-cluster-admin
  labels:
    wiz-exercise/intentional-weakness: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: tasky-sa
    namespace: tasky
